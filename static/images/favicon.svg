<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Crisp drop shadow for the inner mascot -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- High-contrast Brand Green App Badge (stands out on both dark and light browser tabs) -->
  <rect width="64" height="64" rx="14" fill="#245B36"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#B8D77A" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- MakeitDoc Document Mascot (Bright White for maximum contrast) -->
  <g id="mascot" filter="url(#subtleShadow)">
    <!-- Document Body -->
    <path d="M20 9 C26 11, 38 11, 44 9 C46.5 22, 46.5 37, 44 50 C38 48, 26 48, 20 50 C17.5 37, 17.5 22, 20 9 Z" 
          fill="#FFFFFF" stroke="#18231C" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Eyebrows -->
    <path d="M22 16 C24 13.5, 27 14, 29 16.5" fill="none" stroke="#18231C" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M35 16.5 C37 14, 40 13.5, 42 16" fill="none" stroke="#18231C" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Big Cartoon Eyes -->
    <ellipse cx="25.5" cy="22" rx="3.6" ry="5.2" fill="#FFFFFF" stroke="#18231C" stroke-width="1.8"/>
    <ellipse cx="38.5" cy="22" rx="3.6" ry="5.2" fill="#FFFFFF" stroke="#18231C" stroke-width="1.8"/>

    <!-- Pupils (Looking playfully at the user) -->
    <ellipse cx="26.5" cy="22.5" rx="2.1" ry="3.2" fill="#18231C"/>
    <ellipse cx="37.5" cy="22.5" rx="2.1" ry="3.2" fill="#18231C"/>
    <circle cx="27.6" cy="21" r="0.9" fill="#FFFFFF"/>
    <circle cx="38.6" cy="21" r="0.9" fill="#FFFFFF"/>

    <!-- Happy Open Smile with Tongue -->
    <path d="M23 29 C25 36, 39 36, 41 29 Z" fill="#18231C" stroke="#18231C" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M29 32.5 C31 34.5, 33 34.5, 35 32.5" fill="none" stroke="#B8D77A" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Document Text Lines -->
    <line x1="26" y1="38" x2="38" y2="38" stroke="#18231C" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="25" y1="41.5" x2="39" y2="41.5" stroke="#18231C" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="26" y1="45" x2="38" y2="45" stroke="#18231C" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Side Hands holding the paper -->
    <path d="M19.5 27 C16.5 27, 15.5 32, 19.5 33" fill="#FFFFFF" stroke="#18231C" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M44.5 27 C47.5 27, 48.5 32, 44.5 33" fill="#FFFFFF" stroke="#18231C" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Little Feet -->
    <path d="M24 50 C24 54.5, 18.5 55.5, 20.5 56.5 C24.5 56.5, 27 53.5, 26 50" fill="#FFFFFF" stroke="#18231C" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M40 50 C40 54.5, 45.5 55.5, 43.5 56.5 C39.5 56.5, 37 53.5, 38 50" fill="#FFFFFF" stroke="#18231C" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
</svg>
